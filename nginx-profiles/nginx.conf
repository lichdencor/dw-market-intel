server {
    listen 80;
    server_name _;
    root /reports;
    charset utf-8;

    # Autoindex activado en todo — muestra carpetas por fecha y archivos HTML/JSON
    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        autoindex_format html;

        # Para que los HTML de ydata-profiling carguen assets externos
        add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;";
    }
}
