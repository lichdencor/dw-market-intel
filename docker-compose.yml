# =============================================================
# VM 10.10.10.20 — Servicios Docker
#
# Flujo de datos:
#   Collector → MinIO (raw CSV)
#   ETL → PostgreSQL (DW puro: staging + dw + profiling)
#   duckdb-setup → DuckDB (OLAP: tablas materializadas)
#   Metabase → DuckDB (analytics vía JDBC driver nativo)
#   Metabase → PostgreSQL (DW directo solo para admin/operador)
#
# Cube.js eliminado — Metabase conecta directo a DuckDB via JDBC plugin.
#
# Uso:
#   docker compose up -d                                    # MinIO + Metabase
#   docker compose --profile pipeline run --rm collector   # recolectar datos
#   docker compose --profile pipeline run --rm etl         # cargar DW
#   docker compose --profile pipeline run --rm duckdb-setup # materializar OLAP
#   make refresh-olap                                       # stop MB → setup → start MB
# =============================================================

services:

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin1234}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  metabase:
    image: metabase/metabase:latest          # imagen estándar — conecta a PG como siempre
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Argentina/Buenos_Aires
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ------------------------------------------------------------------
  # Nginx — sirve los reportes HTML de ydata-profiling
  # Operador accede a http://10.10.10.20:8080
  # ------------------------------------------------------------------
  profiler-ui:
    image: nginx:alpine
    container_name: profiler-ui
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./profiles:/reports:ro                           # reportes generados por el ETL
      - ./nginx-profiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ------------------------------------------------------------------
  # Anubis — proof-of-work anti-scraper delante de cada servicio
  # Browsers resuelven el challenge en ~2s, bots sin JS quedan afuera.
  # SERVE_ROBOTS_TXT: bloquea a crawlers que respetan robots.txt.
  # ------------------------------------------------------------------
  anubis-metabase:
    image: ghcr.io/techarohq/anubis:latest
    container_name: anubis-metabase
    restart: unless-stopped
    environment:
      BIND: ":8923"
      TARGET: "http://metabase:3000"
      DIFFICULTY: "${ANUBIS_DIFFICULTY:-4}"
      SERVE_ROBOTS_TXT: "true"
    depends_on:
      metabase:
        condition: service_healthy
    profiles: [expose]

  anubis-profiler:
    image: ghcr.io/techarohq/anubis:latest
    container_name: anubis-profiler
    restart: unless-stopped
    environment:
      BIND: ":8923"
      TARGET: "http://profiler-ui:80"
      DIFFICULTY: "${ANUBIS_DIFFICULTY:-4}"
      SERVE_ROBOTS_TXT: "true"
    depends_on:
      - profiler-ui
    profiles: [expose]

  anubis-minio:
    image: ghcr.io/techarohq/anubis:latest
    container_name: anubis-minio
    restart: unless-stopped
    environment:
      BIND: ":8923"
      TARGET: "http://minio:9001"
      DIFFICULTY: "${ANUBIS_DIFFICULTY:-4}"
      SERVE_ROBOTS_TXT: "true"
    depends_on:
      minio:
        condition: service_healthy
    profiles: [expose]

  # ------------------------------------------------------------------
  # Cloudflare Tunnels — apuntan a Anubis (no a los servicios directo)
  # Cada servicio obtiene una URL *.trycloudflare.com automáticamente.
  # Levantar: make expose | Apagar: make unexpose
  # ------------------------------------------------------------------
  cf-metabase:
    image: cloudflare/cloudflared:latest
    container_name: cf-metabase
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://anubis-metabase:8923
    depends_on:
      - anubis-metabase
    profiles: [expose]

  cf-profiler:
    image: cloudflare/cloudflared:latest
    container_name: cf-profiler
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://anubis-profiler:8923
    depends_on:
      - anubis-profiler
    profiles: [expose]

  cf-minio:
    image: cloudflare/cloudflared:latest
    container_name: cf-minio
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://anubis-minio:8923
    depends_on:
      - anubis-minio
    profiles: [expose]

  # ------------------------------------------------------------------
  # DuckDB setup — materializa tablas OLAP desde PostgreSQL
  # Corre como job one-shot después del ETL o manualmente via make refresh-olap
  # ------------------------------------------------------------------
  duckdb-setup:
    build: ./duckdb
    container_name: duckdb-setup
    restart: "no"
    environment:
      DUCKDB_PATH: /data/analytics.duckdb   # local tmp, solo durante la ejecución
      PG_HOST: ${DB_HOST:-10.10.10.10}
      PG_PORT: ${DB_PORT:-5432}
      PG_DBNAME: ${DB_NAME:-dw_analytics}
      PG_USER: ${DB_USER:-etl_user}
      PG_PASSWORD: ${DB_PASSWORD:-etl123}
    volumes:
      - duckdb_data:/data
    profiles: [pipeline]

  # ------------------------------------------------------------------
  # Pipeline — solo con: docker compose --profile pipeline run --rm ...
  # ------------------------------------------------------------------

  collector:
    build: ./pipeline/collector
    profiles: [pipeline]
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin1234}
      MINIO_BUCKET: raw-ohlcv
      PERIOD_DAYS: "365"
      MAX_FILINGS: "500"
    depends_on:
      minio:
        condition: service_healthy

  etl:
    build: ./pipeline/etl
    profiles: [pipeline]
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-admin1234}
      MINIO_BUCKET: raw-ohlcv
      DB_HOST: ${DB_HOST:-10.10.10.10}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-dw_analytics}
      DB_USER: ${DB_USER:-etl_user}
      DB_PASSWORD: ${DB_PASSWORD:-etl123}
      PROFILES_DIR: /app/profiles
      PYTHONWARNINGS: "ignore"
    volumes:
      - ./profiles:/app/profiles

volumes:
  minio_data:
    external: true
    name: chavez_minio_data
  metabase_data:
    external: true
    name: chavez_metabase_data
  duckdb_data:        # compartido: duckdb-setup escribe, metabase lee
